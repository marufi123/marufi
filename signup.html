<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Create an Account | Olive &amp; Thyme</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="signup.css">
</head>
<body>
  <nav class="navbar navbar-expand-lg navbar-light bg-white shadow-sm"><div class="container"><a class="navbar-brand fw-bold" href="homepage.html">🥬 Olive <span>&amp; Thyme</span></a><button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#mainNav" aria-controls="mainNav" aria-expanded="false" aria-label="Toggle navigation"><span class="navbar-toggler-icon"></span></button><div class="collapse navbar-collapse" id="mainNav"><ul class="navbar-nav ms-auto"><li class="nav-item"><a class="nav-link" href="homepage.html">Home</a></li><li class="nav-item"><a class="nav-link" href="menu.html">Menu</a></li><li class="nav-item"><a class="nav-link" href="reservation.html">Reservation</a></li><li class="nav-item"><a class="nav-link active" href="signup.html">Register</a></li><li class="nav-item"><a class="nav-link" href="login.html">Login</a></li></ul></div></div></nav>
  <div class="container"><nav aria-label="breadcrumb"><ol class="breadcrumb py-3 mb-0"><li class="breadcrumb-item"><a href="homepage.html">Home</a></li><li class="breadcrumb-item active" aria-current="page">Create account</li></ol></nav></div>
  <main class="container py-4"><section class="form-card mx-auto"><div class="text-center mb-4"><p class="eyebrow">Become a regular</p><h1>Create your account</h1><p class="text-muted">Join us for seasonal news and easy reservations.</p></div>
    <form action="#" method="post">
      <div class="row g-3 mb-3"><div class="col-sm-6"><label for="firstName" class="form-label">First name</label><input id="firstName" name="firstName" class="form-control" type="text" autocomplete="given-name" required></div><div class="col-sm-6"><label for="lastName" class="form-label">Last name</label><input id="lastName" name="lastName" class="form-control" type="text" autocomplete="family-name" required></div></div>
      <div class="mb-3"><label for="phone" class="form-label">Phone number</label><input id="phone" name="phone" class="form-control" type="tel" autocomplete="tel" required></div>
      <div class="mb-3"><label for="email" class="form-label">Email</label><input id="email" name="email" class="form-control" type="email" autocomplete="email" required></div>
      <div class="mb-4"><label for="password" class="form-label">Password</label><input id="password" name="password" class="form-control" type="password" autocomplete="new-password" minlength="8" required><div class="form-text">Use at least 8 characters.</div></div>
      <button class="btn btn-olive w-100" type="submit">Create account</button>
    </form><p class="small text-center mt-3 mb-0">Already registered? <a href="login.html">Log in</a></p>
  </section></main>
  <footer class="site-footer py-4 mt-5"><div class="container d-flex flex-wrap justify-content-between gap-2"><span>© 2026 Olive &amp; Thyme</span><span><a href="menu.html">Menu</a> · <a href="reservation.html">Reservation</a> · <a href="login.html">Login</a></span></div></footer>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
